# PostgreSQL + pgvector-capable LOCAL-ONLY services, not production configuration.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: plantly
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: plantly
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - plantly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plantly -d plantly']
      interval: 3s
      timeout: 3s
      retries: 20
  test-db:
    image: pgvector/pgvector:pg16
    profiles: [test]
    environment:
      POSTGRES_USER: plantly
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: plantly_test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plantly -d plantly_test']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  plantly_postgres_data:
